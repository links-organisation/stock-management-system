@if (systemService.isShutdown()) {
    <div class="shutdown-screen">
        <p>{{ 'system.stopped' | transloco }}</p>
    </div>
} @else {
    @if (authService.isLoggedIn()) {
        <app-navbar/>
    }
    <main>
        <router-outlet/>
    </main>
    @if (authService.isLoggedIn() && authService.isAdminOrAbove()) {
        <app-network-sharing-widget/>
    }
}
