<nav class="bar">
  <a class="brand" routerLink="/dashboard">Stockroom</a>

  <div class="links">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/products" routerLinkActive="active">Products</a>
    <a routerLink="/sales" routerLinkActive="active">Sell</a>
    <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
    <a routerLink="/history" routerLinkActive="active">History</a>
    <a routerLink="/invoices" routerLinkActive="active">Invoices</a>
  </div>

  @if (authService.currentUser; as user) {
    <div class="account">
      <span class="account__name">{{ user.fullName }}</span>
      <button class="account__logout" type="button" (click)="logout()">Sign out</button>
    </div>
  }
</nav>
