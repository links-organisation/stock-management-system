<div [formGroup]="form" class="selector">
    <label class="field">
        <span>{{ 'sales.product' | transloco }}</span>
        <select formControlName="selectedProductId">
            <option [ngValue]="null">{{ 'sales.chooseProduct' | transloco }}</option>
            @for (product of products(); track product.id) {
                <option [disabled]="product.quantityInStock === 0" [ngValue]="product.id">
                    {{ product.name }} ({{ product.quantityInStock }} {{ 'sales.inStock' | transloco }})
                </option>
            }
        </select>
    </label>

    <label class="field field--qty">
        <span>{{ 'sales.qty' | transloco }}</span>
        <input formControlName="quantity" min="1" type="number"/>
    </label>

    <button (click)="onAdd()" [disabled]="!selectedProduct()" type="button">{{ 'sales.addToSale' | transloco }}</button>
</div>

@if (selectedProduct(); as product) {
    <p class="price-hint">{{ product.sellingPrice | fcfa }} {{ 'sales.each' | transloco }}</p>
}
