<div [formGroup]="form" class="selector">
    <label class="field">
        <span>Product</span>
        <select formControlName="selectedProductId">
            <option [ngValue]="null">Choose a product…</option>
            @for (product of products(); track product.id) {
                <option [disabled]="product.quantityInStock === 0" [ngValue]="product.id">
                    {{ product.name }} ({{ product.quantityInStock }} in stock)
                </option>
            }
        </select>
    </label>

    <label class="field field--qty">
        <span>Qty</span>
        <input formControlName="quantity" min="1" type="number"/>
    </label>

    <button (click)="onAdd()" [disabled]="!selectedProduct()" type="button">Add to sale</button>
</div>

@if (selectedProduct(); as product) {
    <p class="price-hint">{{ product.sellingPrice | fcfa }} each</p>
}
