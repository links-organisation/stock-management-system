<div class="page">
    <h1>{{ 'sales.newSale' | transloco }}</h1>

    <div class="layout">
        <section class="panel">
            <h2>{{ 'sales.addProducts' | transloco }}</h2>
            <app-product-selector (add)="onAddToCart($event)" [products]="products()"></app-product-selector>

            <label class="field customer">
                <span>{{ 'sales.customerOptional' | transloco }}</span>
                <input [formControl]="customerName" [placeholder]="'sales.walkInCustomer' | transloco" type="text"/>
            </label>
        </section>

        <section class="panel">
            <h2>{{ 'sales.currentSale' | transloco }}</h2>

            @if (errorMessage()) {
                <p class="status status--error">{{ errorMessage() }}</p>
            }
            @if (successMessage()) {
                <p class="status status--success">{{ successMessage() }}</p>
            }

            <app-cart-summary
                (checkout)="onCheckout()"
                (removeLine)="onRemoveLine($event)"
                [isSubmitting]="isSubmitting()"
                [lines]="cart()"
            ></app-cart-summary>
        </section>
    </div>
</div>
