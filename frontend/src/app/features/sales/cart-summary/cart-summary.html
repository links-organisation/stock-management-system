<div class="cart">
    @if (lines().length === 0) {
        <p class="empty">Add products to build up the sale.</p>
    } @else {
        <ul class="lines">
            @for (line of lines(); track line.productId) {
                <li>
                    <span class="lines__name">{{ line.productName }}</span>
                    <span class="data">{{ line.quantity }} × {{ line.unitPrice | fcfa }}</span>
                    <span class="data lines__subtotal">{{ line.quantity * line.unitPrice | fcfa }}</span>
                    <button (click)="removeLine.emit(line.productId)" aria-label="Remove" class="lines__remove"
                            type="button">×
                    </button>
                </li>
            }
        </ul>

        <div class="total">
            <span>Total</span>
            <span class="data total__amount">{{ total() | fcfa }}</span>
        </div>

        <button (click)="checkout.emit()" [disabled]="isSubmitting()" class="checkout" type="button">
            {{ isSubmitting() ? 'Completing sale…' : 'Complete sale' }}
        </button>
    }
</div>
