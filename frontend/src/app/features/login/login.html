<div class="screen">
    <section class="brand">
        <div class="brand__mark">Stockroom</div>
        <p class="brand__tagline">Track what's on the shelf, who sold it, and what it's worth.</p>
        <div class="brand__bar"></div>
    </section>

    <section class="panel">
        <form (ngSubmit)="onSubmit()" class="form" novalidate>
            <h1>Sign in</h1>
            <p class="form__hint">Use your shop account to continue.</p>

            <label class="field">
                <span>Username</span>
                <input
                    [(ngModel)]="username"
                    autocomplete="username"
                    autofocus
                    name="username"
                    required
                    type="text"
                />
            </label>

            <label class="field">
                <span>Password</span>
                <input
                    [(ngModel)]="password"
                    autocomplete="current-password"
                    name="password"
                    required
                    type="password"
                />
            </label>

            @if (errorMessage) {
                <p class="form__error">{{ errorMessage }}</p>
            }

            <button [disabled]="isSubmitting" class="form__submit" type="submit">
                {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
            </button>
        </form>
    </section>
</div>
