<div class="screen">
    <section class="brand">
        <div class="brand__mark">Stockroom</div>
        <p class="brand__tagline">{{ 'login.tagline' | transloco }}</p>
        <div class="brand__bar"></div>
    </section>

    <section class="panel">
        <form (ngSubmit)="onSubmit()" [formGroup]="form" class="form" novalidate>
            <h1>{{ 'login.title' | transloco }}</h1>
            <p class="form__hint">{{ 'login.hint' | transloco }}</p>

            <label class="field">
                <span>{{ 'login.username' | transloco }}</span>
                <input
                    autocomplete="username"
                    autofocus
                    formControlName="username"
                    type="text"
                />
            </label>

            <label class="field">
                <span>{{ 'login.password' | transloco }}</span>
                <input
                    autocomplete="current-password"
                    formControlName="password"
                    type="password"
                />
            </label>

            @if (errorMessage()) {
                <p class="form__error">{{ errorMessage() }}</p>
            }

            <button [disabled]="isSubmitting()" class="form__submit" type="submit">
                {{ isSubmitting() ? ('login.signingIn' | transloco) : ('login.signIn' | transloco) }}
            </button>
        </form>
    </section>
</div>
