<div class="screen">
  <section class="brand">
    <div class="brand__mark">Stockroom</div>
    <p class="brand__tagline">Track what's on the shelf, who sold it, and what it's worth.</p>
    <div class="brand__bar"></div>
  </section>

  <section class="panel">
    <form class="form" (ngSubmit)="onSubmit()" novalidate>
      <h1>Sign in</h1>
      <p class="form__hint">Use your shop account to continue.</p>

      <label class="field">
        <span>Username</span>
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          autocomplete="username"
          required
          autofocus
        />
      </label>

      <label class="field">
        <span>Password</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
      </label>

      @if (errorMessage) {
        <p class="form__error">{{ errorMessage }}</p>
      }

      <button type="submit" class="form__submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</div>
