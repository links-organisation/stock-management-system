<div (click)="cancel.emit()" class="backdrop">
    <form (click)="$event.stopPropagation()" (ngSubmit)="onSubmit()" [formGroup]="form" class="sheet" novalidate>
        <h2>{{ isEditing() ? 'Edit user' : 'Register a user' }}</h2>

        <label class="field">
            <span>Full name</span>
            <input formControlName="fullName" type="text"/>
        </label>

        <label class="field">
            <span>Username</span>
            <input formControlName="username" type="text"/>
        </label>

        <label class="field">
            <span>{{ isEditing() ? 'New password (leave blank to keep current)' : 'Password' }}</span>
            <input formControlName="password" type="password"/>
        </label>

        <label class="field">
            <span>Role</span>
            <select formControlName="role">
                @for (role of assignableRoles(); track role.value) {
                    <option [ngValue]="role.value">{{ role.label }}</option>
                }
            </select>
        </label>

        <footer>
            <button (click)="cancel.emit()" class="ghost" type="button">Cancel</button>
            <button class="primary" type="submit">{{ isEditing() ? 'Save changes' : 'Register user' }}</button>
        </footer>
    </form>
</div>
