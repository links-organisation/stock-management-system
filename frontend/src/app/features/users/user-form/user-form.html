<div class="backdrop" (click)="cancel.emit()">
  <form class="sheet" (click)="$event.stopPropagation()" (ngSubmit)="onSubmit()" novalidate>
    <h2>{{ isEditing ? 'Edit user' : 'Register a user' }}</h2>

    <label class="field">
      <span>Full name</span>
      <input type="text" name="fullName" [(ngModel)]="model.fullName" required />
    </label>

    <label class="field">
      <span>Username</span>
      <input type="text" name="username" [(ngModel)]="model.username" required />
    </label>

    <label class="field">
      <span>{{ isEditing ? 'New password (leave blank to keep current)' : 'Password' }}</span>
      <input type="password" name="password" [(ngModel)]="model.password" [required]="!isEditing" />
    </label>

    <label class="field">
      <span>Role</span>
      <select name="role" [(ngModel)]="model.role" required>
        @for (role of assignableRoles; track role.value) {
          <option [ngValue]="role.value">{{ role.label }}</option>
        }
      </select>
    </label>

    <footer>
      <button type="button" class="ghost" (click)="cancel.emit()">Cancel</button>
      <button type="submit" class="primary">{{ isEditing ? 'Save changes' : 'Register user' }}</button>
    </footer>
  </form>
</div>
