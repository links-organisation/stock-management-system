<div (click)="cancel.emit()" class="backdrop">
    <form (click)="$event.stopPropagation()" (ngSubmit)="onSubmit()" class="sheet" novalidate>
        <h2>{{ isEditing ? 'Edit user' : 'Register a user' }}</h2>

        <label class="field">
            <span>Full name</span>
            <input [(ngModel)]="model.fullName" name="fullName" required type="text"/>
        </label>

        <label class="field">
            <span>Username</span>
            <input [(ngModel)]="model.username" name="username" required type="text"/>
        </label>

        <label class="field">
            <span>{{ isEditing ? 'New password (leave blank to keep current)' : 'Password' }}</span>
            <input [(ngModel)]="model.password" [required]="!isEditing" name="password" type="password"/>
        </label>

        <label class="field">
            <span>Role</span>
            <select [(ngModel)]="model.role" name="role" required>
                @for (role of assignableRoles; track role.value) {
                    <option [ngValue]="role.value">{{ role.label }}</option>
                }
            </select>
        </label>

        <footer>
            <button (click)="cancel.emit()" class="ghost" type="button">Cancel</button>
            <button class="primary" type="submit">{{ isEditing ? 'Save changes' : 'Register user' }}</button>
        </footer>
    </form>
</div>
