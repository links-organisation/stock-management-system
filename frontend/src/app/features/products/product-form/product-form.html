<div (click)="cancel.emit()" class="backdrop">
    <form (click)="$event.stopPropagation()" (ngSubmit)="onSubmit()" [formGroup]="form" class="sheet" novalidate>
        <h2>{{ isEditing() ? 'Edit product' : 'Register a product' }}</h2>

        <label class="field">
            <span>Name</span>
            <input formControlName="name" type="text"/>
        </label>

        <label class="field">
            <span>Reference / SKU</span>
            <input formControlName="reference" type="text" [readonly]="form.get('categoryId')?.value"/>
        </label>

        <label class="field">
            <span>Category</span>
            <select formControlName="categoryId">
                <option [ngValue]="null">Uncategorized</option>
                @for (category of categories(); track category.id) {
                    <option [ngValue]="category.id">{{ category.name }}</option>
                }
            </select>
        </label>

        <div class="row">
            <label class="field">
                <span>Purchase price</span>
                <input formControlName="purchasePrice" min="0" step="0.01" type="number"/>
            </label>

            <label class="field">
                <span>Selling price</span>
                <input formControlName="sellingPrice" min="0" step="0.01" type="number"/>
            </label>
        </div>

        <div class="row">
            <label class="field">
                <span>Quantity in stock</span>
                <input formControlName="quantityInStock" min="0" step="1" type="number"/>
            </label>

            <label class="field">
                <span>Alert threshold</span>
                <input formControlName="alertThreshold" min="0" step="1" type="number"/>
            </label>
        </div>

        <footer>
            <button (click)="cancel.emit()" class="ghost" type="button">Cancel</button>
            <button class="primary" type="submit">{{ isEditing() ? 'Save changes' : 'Register product' }}</button>
        </footer>
    </form>
</div>
