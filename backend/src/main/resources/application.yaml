server:
    port: 8080

spring:
    application:
        name: stock-management

    # H2 file-based database (survives restarts, zero external setup)
    datasource:
        url: jdbc:h2:file:${user.home}/.h2/sms/db/stockdb;AUTO_SERVER=TRUE
        driver-class-name: org.h2.Driver
        username: links
        password: links

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    h2:
        console:
            enabled: true
            path: /h2-console

application:
    allowed:
        origins: http://localhost:4200
        methods: GET, POST, PUT, DELETE, OPTIONS